apiVersion: 1

providers:
  - name: "Asset Monitoring"
    orgId: 1
    folder: "Asset Monitoring"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/json
      foldersFromFilesStructure: false
