<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg)"/>
  <!-- Desk top -->
  <rect x="60" y="120" width="280" height="20" rx="4" fill="#b45309" stroke="url(#accent)" stroke-width="2"/>
  <!-- Desk legs -->
  <rect x="80" y="140" width="16" height="85" fill="#475569"/>
  <rect x="304" y="140" width="16" height="85" fill="#475569"/>
  <!-- Drawer cabinet -->
  <rect x="230" y="140" width="70" height="75" fill="#334155" stroke="#f97316" stroke-width="1.5"/>
  <line x1="245" y1="160" x2="285" y2="160" stroke="#f97316" stroke-width="3" stroke-linecap="round"/>
  <line x1="245" y1="185" x2="285" y2="185" stroke="#f97316" stroke-width="3" stroke-linecap="round"/>
  <line x1="245" y1="205" x2="285" y2="205" stroke="#f97316" stroke-width="3" stroke-linecap="round"/>
  <text x="200" y="265" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="bold" font-size="20" fill="#fb923c">NỘI THẤT VĂN PHÒNG</text>
</svg>