<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg)"/>
  <!-- Wrench and Screwdriver crossed -->
  <g transform="translate(200, 130)">
    <!-- Screwdriver -->
    <rect x="-8" y="-70" width="16" height="70" rx="4" fill="#94a3b8" transform="rotate(45)"/>
    <rect x="-14" y="0" width="28" height="60" rx="6" fill="#0891b2" transform="rotate(45)"/>
    <!-- Wrench -->
    <path d="M-55,-25 L-25,-55 L35,5 L15,25 Z" fill="#64748b"/>
    <circle cx="-50" cy="-35" r="22" fill="#64748b"/>
    <circle cx="-50" cy="-35" r="12" fill="#0f172a"/>
  </g>
  <text x="200" y="265" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="bold" font-size="20" fill="#22d3ee">DỤNG CỤ KỸ THUẬT</text>
</svg>