<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg)"/>
  <!-- Screen frame -->
  <rect x="60" y="45" width="280" height="160" rx="8" fill="#334155" stroke="url(#accent)" stroke-width="3"/>
  <rect x="72" y="57" width="256" height="136" rx="4" fill="#0f172a"/>
  <!-- Graphic chart on screen -->
  <polyline points="90,160 140,110 180,135 230,85 280,120 310,95" fill="none" stroke="#a855f7" stroke-width="3" stroke-linecap="round"/>
  <!-- Stand -->
  <rect x="188" y="205" width="24" height="30" fill="#475569"/>
  <rect x="140" y="235" width="120" height="10" rx="4" fill="#64748b"/>
  <text x="200" y="275" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="bold" font-size="20" fill="#c084fc">MÀN HÌNH MÁY TÍNH</text>
</svg>