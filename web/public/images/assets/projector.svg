<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg)"/>
  <!-- Projector body -->
  <rect x="60" y="90" width="280" height="110" rx="12" fill="#334155" stroke="url(#accent)" stroke-width="3"/>
  <!-- Projector lens -->
  <circle cx="120" cy="145" r="38" fill="#1e293b" stroke="#f59e0b" stroke-width="4"/>
  <circle cx="120" cy="145" r="22" fill="#0f172a" stroke="#fbbf24" stroke-width="2"/>
  <circle cx="128" cy="138" r="8" fill="#fef3c7" opacity="0.6"/>
  <!-- Vent grill -->
  <line x1="200" y1="120" x2="300" y2="120" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
  <line x1="200" y1="135" x2="300" y2="135" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
  <line x1="200" y1="150" x2="300" y2="150" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
  <line x1="200" y1="165" x2="300" y2="165" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
  <!-- Legs -->
  <rect x="90" y="200" width="24" height="12" rx="4" fill="#475569"/>
  <rect x="286" y="200" width="24" height="12" rx="4" fill="#475569"/>
  <text x="200" y="265" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="bold" font-size="20" fill="#fbbf24">MÁY CHIẾU</text>
</svg>